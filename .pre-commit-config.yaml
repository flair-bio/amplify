# Prevent pre-commit from modifying machine-generated Agentic Workflow files
exclude: |
    (?x)^(
        \.github/workflows/agentics-.*|        # Ignore the maintenance worker
        \.github/workflows/.*\.lock\.yml|      # Ignore agent lock files
        \.github/aw/.* # Ignore agent internals
    )$


repos:

# --- General hooks ---
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: check-json
    -   id: check-added-large-files
        files: ^modules/

# Jupyter Notebook cleaning
-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    -   id: nbstripout

# Spell checking
# -   repo: https://github.com/codespell-project/codespell
#     rev: v2.4.2
#     hooks:
#     -   id: codespell
#         args: ['--config', '.codespellrc'] # See .codespellrc for configuration
