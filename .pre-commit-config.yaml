#     rev: v8.30.0
#     hooks:
#     -   id: gitleaks
# TODO Disabled for WIP; re-enable or remove completely once codebase more stable

# --- python_package hooks ---
# Code formatting and linting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
    -   id: ruff
        args: [
            --fix,
            --select=I,ANN, # for isort and type annotations
            --ignore=ANN101,ANN102 # ignore 'self' and 'cls' type hints
          ]
        files: ^flair-plm/modules/
    -   id: ruff-format
        files: ^modules/
# TODO Disabled for WIP; re-enable or remove completely once codebase more stable

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
    -   id: mypy
        args: [
            --disallow-untyped-defs,       # requires hints on all functions
            --disallow-incomplete-defs,    # requires hints if even one is missing
            --check-untyped-defs,          # type check bodies of functions without hints
            --ignore-missing-imports       # prevents errors from 3rd party libs without types
        ]
        files: ^modules/

        additional_dependencies: [types-requests, types-setuptools, types-PyYAML]
