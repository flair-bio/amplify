steps:
  download:
    # unlike bfd/uniref (one huge file), mgnify is split across 25 separate source
    # URLs, so each file needs fewer split chunks/connections but several files can
    # download concurrently.
    split: 2
    max_connections_per_server: 2
    min_split_size: 10M
    max_concurrent_downloads: 3

  preprocess:
    # base config.yaml uses single-threaded settings sized for the tiny yeast smoke
    # test; mgnify is a large production dataset run on a full compute node, so
    # extraction/writing/splitting/stats/conversion are parallelized accordingly.
    fasta_extract_threads: 16
    fasta_write_threads: 16
    fasta_split_threads: 8
    stats_threads: 128
    parquet_conversion_workers: 14

  cluster:
    num_threads: 192  # matches a standard-tier CPU node (192 cores / 700G mem); the cluster sbatch job overrides this via steps.cluster.num_threads="$SLURM_CPUS_ON_NODE"
