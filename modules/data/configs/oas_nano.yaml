steps:
  download:
    split: 16
    max_connections_per_server: 16

  preprocess:
    # OAS's paired-CSV extraction writes Parquet shards directly during FASTA
    # generation (see preprocess.py:_generate_oas_fasta), so the generic
    # FASTA->Parquet conversion step is redundant and explicitly disabled here.
    convert_fasta_to_parquet: false
    # base config.yaml uses single-threaded settings sized for the tiny yeast smoke
    # test; oas is a large production dataset run on a full compute node, so
    # extraction/writing/splitting/conversion are parallelized accordingly.
    fasta_extract_threads: 16
    fasta_write_threads: 16
    fasta_split_threads: 8
    parquet_conversion_workers: 14

  cluster:
    # OAS sequences are short antibody chains, so clustering needs much stricter
    # identity/coverage thresholds than the other sources to avoid collapsing
    # distinct clonotypes into the same cluster.
    identity_thresholds: [0.99, 0.98, 0.97, 0.96, 0.95, 0.94, 0.93, 0.92, 0.91, 0.9, 0.85, 0.8]
    coverage_threshold: 0.95
    num_threads: 64  # OAS cluster jobs may override this with "$SLURM_CPUS_ON_NODE".
    mmseqs:
      command:
        split_memory_limit: "200G"  # smaller than the base default (400G); tuned for the node allocation used for OAS clustering runs
        num_join_buckets: 10  # fewer join buckets than the base default (32); OAS's stricter thresholds produce far fewer/smaller clusters to merge

  upload:
    repo_id: flair-bio/oas-nano
