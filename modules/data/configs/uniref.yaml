# Overlay on config.yaml — only fields that differ from the base defaults.
# Usage: run_data.py config.yaml uniref.yaml
dataset:
  name: uniref
  source_urls:
    - https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref100/uniref100.fasta.gz

steps:
  download:
    split: 16                        # single massive file: split into 16 chunks
    max_connections_per_server: 16   # download all 16 chunks concurrently

  preprocess:
    # base config.yaml uses single-threaded settings sized for the tiny yeast smoke
    # test; uniref100 is a large production dataset run on a full compute node, so
    # extraction/writing/splitting/stats/conversion are parallelized accordingly.
    fasta_extract_threads: 16
    fasta_write_threads: 16
    fasta_split_threads: 8
    stats_threads: 128
    parquet_conversion_workers: 14

  score:
    batch_size: 8  # empirically tuned smaller than the base default (16) to avoid GPU OOM when scoring uniref100 in production

  cluster:
    num_threads: 192  # matches a standard-tier CPU node (192 cores / 700G mem); the cluster sbatch job overrides this via steps.cluster.num_threads="$SLURM_CPUS_ON_NODE"
