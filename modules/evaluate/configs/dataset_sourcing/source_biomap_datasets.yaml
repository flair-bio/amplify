# One-off biomap sourcing configuration.
# Run from the repository root and pass this file as a config argument.

# Dataset selection: all_datasets=true processes all 13 source datasets and
# takes precedence over datasets. Set it to false to use selected names below.
# Available names:
# ssp_q3, ssp_q8, fold_prediction, fitness_prediction, metal_ion_binding,
# localization_prediction, enzyme_catalytic_efficiency, optimal_ph, optimal_temperature,
# temperature_stability, stability_prediction, solubility_prediction,
# contact_prediction_binary.
# Example CLI selection: all_datasets=false datasets=[ssp_q3,metal_ion_binding]

# Seeds random splits, validation synthesis, and cluster tie-breaks.
seed: 1957723

all_datasets: true
datasets:
  - ssp_q3
  - ssp_q8
  - fold_prediction
  - fitness_prediction
  - metal_ion_binding
  - localization_prediction
  - enzyme_catalytic_efficiency
  - optimal_ph
  - optimal_temperature
  - temperature_stability
  - stability_prediction
  - solubility_prediction
  - contact_prediction_binary

# Source and preprocessing.
work_dir: eval_datasets/biomap_research_sourcing
preprocess: minimal
# Longer sequences are dropped, not truncated; null keeps all.
max_sequence_length: null
# Pin the upstream HF dataset to a commit for reproducibility; null tracks the default
# branch. Override from the CLI (source_revision=<sha>); it is recorded in each card.
# source_revision: null

# Splits: optionally add pooled random, stratified, and MMseqs cluster splits.
create_split_subsets: true

# Upload: per_dataset_repo creates one repository per dataset under repo_owner;
# single_repo stores all selected datasets under repo_prefix/<dataset_name>.
upload_layout: per_dataset_repo

# Set repo_owner or repo_id to upload; leave both null to build local artifacts only.
repo_owner: null
repo_name_prefix: biomap-research-
repo_id: null
repo_prefix: biomap-research
# Hub branch to upload to; unrelated to source_revision.
revision: null
commit_message: Add sourced biomap-research datasets
# Published repos are public here; the schema default is true.
private: false
token: null

# Run controls.
# force_download re-fetches sources; overwrite_output regenerates even if outputs match.
force_download: false
overwrite_output: false
# Threads for SeqKit stats.
stats_threads: 8
