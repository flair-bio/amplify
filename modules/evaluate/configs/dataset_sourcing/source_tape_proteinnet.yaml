# One-off TAPE ProteinNet LMDB sourcing configuration.
# Run from the repository root and pass this file as a config argument.

# Fixed source: this script always writes proteinnet_contact_prediction.
# Seeds split assignment and cluster tie-breaks.
seed: 1957723

# Source and preprocessing.
work_dir: eval_datasets/tape_proteinnet_sourcing
preprocess: minimal
# Applied before contact maps are computed; longer sequences are dropped. null keeps all.
max_sequence_length: null

# Splits: optionally add pooled random, stratified, and MMseqs cluster splits.
create_split_subsets: true

# Source: read pre-staged LMDB split directories from this folder.
source_folder: downloaded_datasets

# Fallback LMDB archive, used only when source_folder has no LMDB splits.
archive_url: http://s3.amazonaws.com/songlabdata/proteindata/data_pytorch/proteinnet.tar.gz
archive_path: null
# Has no effect while create_split_subsets is true (only train/validation/test are kept).
include_train_unfiltered: false

# Upload: per_dataset_repo creates one repository per dataset under repo_owner;
# single_repo stores all selected datasets under repo_prefix/<dataset_name>.
upload_layout: per_dataset_repo

repo_owner: null
repo_name_prefix: tape-
repo_id: null
repo_prefix: tape
# Hub branch to upload to.
revision: null
commit_message: Add sourced TAPE ProteinNet contact prediction dataset
# Published repos are public here; the schema default is true.
private: false
token: null

force_download: false
overwrite_output: false
# Threads for SeqKit stats.
stats_threads: 8
