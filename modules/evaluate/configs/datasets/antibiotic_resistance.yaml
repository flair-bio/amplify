workspace:
  # Provisional HMD-ARG: 14 single-label drug classes, not binary resistance.
  default_task_type: sequence_classification
  dataset_name: antibiotic_resistance
  dataset_repo_id: flair-bio/evaluation-suite
  dataset_config_name: antibiotic_resistance
  target_type: categorical
  label_format: scalar
  num_labels: 14

steps:
  prepare:
    max_length: 2048
    split:
      refit_additional_splits: [tuning_excluded]
  tune:
    refit_on_train_validation: true
    metric_aggregation: macro
  score:
    metrics: [f1]
    metric_aggregation: macro
