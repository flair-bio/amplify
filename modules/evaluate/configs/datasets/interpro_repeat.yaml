workspace:
  default_task_type: sequence_multilabel_classification
  dataset_name: interpro_repeat
  dataset_repo_id: flair-bio/evaluation-suite
  dataset_config_name: interpro_repeat
  target_type: categorical
  label_format: multilabel
  num_labels: 10

steps:
  tune:
    hyperparameter_search:
      metric: f1
      direction: maximize
  score:
    metrics: [f1, multilabel_mcc, average_precision]
    metric_aggregation: macro
