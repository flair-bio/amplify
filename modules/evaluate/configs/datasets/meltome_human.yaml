workspace:
  default_task_type: sequence_regression
  dataset_name: meltome_human
  dataset_repo_id: flair-bio/meltome_human
  target_type: continuous
  label_format: scalar
  num_labels: null

steps:
  tune:
    hyperparameter_search:
      metric: spearmanr
      direction: maximize
  score:
    metrics: [spearmanr]
  predict:
    controls: [random_trunk]
