dataset:
  name: stability_prediction
  repo_id: flair-bio/biomap-research-stability_prediction
  target_type: continuous
  label_format: scalar
  num_labels: null

# Grouped Macro-Spearman is the target protocol, but verified parent-design
# metadata and grouped scoring are not yet available. This is pooled Spearman.
training:
  hyperparameter_search:
    metric: spearmanr
    direction: maximize
scoring:
  metrics: [spearmanr]
