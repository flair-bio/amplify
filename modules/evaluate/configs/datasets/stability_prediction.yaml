workspace:
  default_task_type: sequence_regression
  dataset_name: stability_prediction
  dataset_repo_id: flair-bio/evaluation-suite
  dataset_config_name: stability_prediction
  target_type: continuous
  label_format: scalar
  num_labels: null

# Validation uses pooled Spearman; test uses an equal-weight mean across clusters.
steps:
  tune:
    hyperparameter_search:
      metric: spearmanr
      direction: maximize
  score:
    group_column: cluster_id  # Set null for pooled test metrics.
    metrics: [spearmanr, mse]
    metric_aggregation: macro
