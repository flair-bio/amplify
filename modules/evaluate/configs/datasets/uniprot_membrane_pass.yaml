workspace:
  default_task_type: token_classification
  dataset_name: uniprot_membrane_pass
  dataset_repo_id: flair-bio/evaluation-suite
  dataset_config_name: uniprot_membrane_pass
  target_type: categorical
  label_format: per_token
  num_labels: 3

steps:
  tune:
    metric_aggregation: macro
    hyperparameter_search:
      metric: f1
      direction: maximize
  score:
    metrics: [f1, accuracy]
    metric_aggregation: macro
