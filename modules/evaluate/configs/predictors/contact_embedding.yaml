predictor:
  mode: tune_probe
  head:
    head_type: bilinear512
representation:
  embedding_cache:
    enabled: false
    cache_policy: reuse
training:
  learning_rate: 0.001
  weight_decay: 10.0
  max_epochs: 10000 # safety limit: reaching it before patience is a failed fit
  warmup_ratio: 0.0
  max_grad_norm: 0.0
  accumulation_steps: 1
  batch_size: 20
  standardize_features: false
  early_stopping_patience: 10
  optimizer: adamw
  optimizer_kwargs: {}
  lr_scheduler_type: constant
  scheduler_kwargs: {}
  refit_on_train_validation: false
  variance_seeds: []
  hyperparameter_search:
    enabled: false
