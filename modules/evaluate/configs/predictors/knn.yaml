# KNN probe over frozen-trunk embeddings. Layer after config.yaml, a model
# config, and a dataset config.
# Built-in search space for the frozen-trunk KNN probe.
predictor:
  mode: tune_probe
  head:
    head_type: knn
    search_space:
      n_neighbors: [1, 3, 5, 10, 20]
representation:
  embedding_cache:
    enabled: true
    pooling: mean
    layers: [-1]
training:
  refit_on_train_validation: true
  hyperparameter_search:
    search_space:
      hidden_size: null
      hidden_depth: null
      batch_size: null
