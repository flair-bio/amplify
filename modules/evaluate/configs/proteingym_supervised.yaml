# ProteinGym supervised scoring configuration.
# Uses the regular workspace disk layout with a dedicated assay runner.

workspace:
  model_name: amplify-120m
  model_repo_id: flair-bio/amplify-120m
  dataset_name: proteingym-dms_substitutions
  dataset_config_name: proteingym-dms_substitutions # subfolder in the suite
  dataset_repo_id: flair-bio/evaluation-suite # or a local suite directory
  dataset_revision: null # pin a Hub commit; must be null for local data
  output_dir: eval # benchmark root, not the final run directory
  run_id: run01

force_download: false

# One of: fold_random_5 | fold_modulo_5 | fold_contiguous_5 |
# official_average | seeded | custom_kfold.
split: fold_random_5
custom_kfold_splits: 5

# linear=Ridge/LogisticRegression; mlp=Linear-GELU-Linear; torch_linear=nn.Linear.
probe_type: linear
probe_hyperparameters: {} # fixed constructor kwargs for the selected probe
# Grid-search candidates on an inner training holdout; {} disables tuning.
probe_search_space: {}

batch_size: 8
max_length: 1024
max_assays: null # null evaluates every sourced assay

dtype: float32
tf32: true # allow TensorFloat-32 for CUDA FP32 operations; false restores full FP32
device: null # null selects CUDA when available, otherwise CPU
seed: 1957723
# Add a bootstrap standard error to summary.json when enabled.
compute_uncertainty: false
n_bootstrap: 10000
