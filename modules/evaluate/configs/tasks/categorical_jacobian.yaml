workspace:
  task_type: categorical_jacobian
  model_kwargs:
    mutant_batch_size: 256
    max_jacobian_bytes: 536870912

steps:
  mode: evaluate_as_is
  tune:
    hyperparameter_search:
      metric: contact_auc_long
      direction: maximize
  score:
    metrics: [contact_auc_long]
  prepare:
    embedding_cache:
      enabled: false
  predict:
    controls: [random_trunk, separation_prior]
