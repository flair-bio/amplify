workspace:
  task_type: contact_prediction_embedding
  model_kwargs: {}

steps:
  mode: tune_probe
  prepare:
    embedding_cache:
      enabled: false
      cache_policy: reuse
  tune:
    head:
      head_type: bilinear512
    learning_rate: 0.001
    weight_decay: 10.0
    max_epochs: 10000 # safety limit: reaching it before patience is a failed fit
    warmup_ratio: 0.0
    max_grad_norm: 0.0
    accumulation_steps: 1
    batch_size: 20
    standardize_features: false
    early_stopping_patience: 10
    optimizer: adamw
    optimizer_kwargs: {}
    lr_scheduler_type: constant
    scheduler_kwargs: {}
    refit_on_train_validation: false
    variance_seeds: []
    hyperparameter_search:
      enabled: false
  predict:
    controls: []
    collect_probabilities: false
  score:
    metrics: [AUC, P@L, P@L/2, P@L/5, ROC-AUC]
    bootstrap_enabled: false
