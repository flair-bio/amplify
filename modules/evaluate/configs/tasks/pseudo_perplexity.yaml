workspace:
  task_type: pseudo_perplexity

steps:
  mode: evaluate_as_is
  tune:
    hyperparameter_search:
      enabled: false
    refit_on_train_validation: false
  score:
    metrics: [pseudo_perplexity]
  prepare:
    # Keep the suite's test-only roles; do not expand it again as train/validation.
    batch_size: 8 # one masked residue per row
    tokenize_num_proc: 1 # expansion can produce millions of rows; avoid parallel copies
    random_truncate_by_split:
      train: false
    embedding_cache:
      enabled: false
  predict:
    controls: [random_trunk]
