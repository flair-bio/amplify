workspace:
  task_type: sequence_multilabel_classification

steps:
  tune:
    hyperparameter_search:
      metric: f1
      direction: maximize
  score:
    metrics: [f1]
    metric_aggregation: macro # equal weight per label column
  prepare:
    embedding_cache:
      enabled: true
  predict:
    embedding_batch_size: 1024
    controls: [random_trunk] # majority_class does not support multilabel targets
