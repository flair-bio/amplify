# Gradient-trained MLP probe over frozen-trunk embeddings.
# Layer after config.yaml, a model config, and a dataset config.
steps:
  mode: tune_probe
  prepare:
    embedding_cache:
      enabled: true
      pooling: mean
      layers: [-1]
  tune:
    head:
      head_type: mlp
      hidden_size: 1024 # fixed width when hyperparameter search is disabled
    hyperparameter_search:
      enabled: true
      n_trials: 24 # total trials across all widths
      search_pattern: bohb
      search_space:
        hidden_size: [128, 256, 512, 1024]
        learning_rate: [1e-3, 5e-4, 1e-4]
        max_epochs: [10, 20, 40]
        weight_decay: [1e-4, 1e-3]
