# Random forest probe over frozen-trunk embeddings.
# Layer after config.yaml, a model config, and a dataset config.
steps:
  mode: tune_probe
  prepare:
    embedding_cache:
      enabled: true
      pooling: mean
      layers: [-1]
  tune:
    refit_on_train_validation: true
    head:
      head_type: random_forest
      search_space:
        n_estimators: [100, 300, 500]
        max_depth: [null, 10, 20]
