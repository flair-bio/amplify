# Step 1 of calibration sourcing from scratch: HHblits alignments, one
# <work_dir>/a3m/<id>.a3m per protein. Run on a cluster as a SLURM array; each
# task takes every shard_count-th protein and skips proteins already aligned:
#
#   sbatch --array=0-99 --cpus-per-task=8 --wrap "uv run python \
#     modules/evaluate/scripts/dataset_sourcing/run_hhblits.py \
#     modules/evaluate/scripts/dataset_sourcing/configs/run_hhblits.yaml \
#     database=/path/to/bfd/bfd_metaclust_clu_complete_id30_c90_final_seq.sorted_opt cpu=8"
#
# Then build the dataset with source_calibration.yaml.

# UniProt human reference proteome (one canonical protein per gene), or any
# FASTA URL / local path.
fasta: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/reference_proteomes/Eukaryota/UP000005640/UP000005640_9606.fasta.gz
database: null  # required: HHblits database prefix (e.g. BFD)
work_dir: eval_datasets/calibration_sourcing
hhblits_bin: hhblits
# Max pairwise identity 99%, min coverage and identity with the query 50%.
hhblits_args: ["-id", "99", "-cov", "50", "-qid", "50"]
cpu: 4
# null: use SLURM_ARRAY_TASK_ID / SLURM_ARRAY_TASK_MIN / SLURM_ARRAY_TASK_MAX.
shard_index: null
shard_count: null
force_download: false
