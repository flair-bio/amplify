# GPU smoke test — overlay on config.yaml. Pass both files together:
#   run_pretrain.py configs/config.yaml configs/smoke_gpu.yaml

model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 8
  intermediate_size: 512
  embedding_init_range: 0.02
  decoder_init_range: 0.02
  norm_eps: 1e-5
  vocab_size: 32
  pad_token_id: 0
  bos_token_id: 3
  eos_token_id: 4
  max_position_embeddings: 512
  rope_theta: 10000.0
  num_labels: 2

scheduler:
  num_warmup_steps: 10
  num_training_steps: 150

collator:
  max_length: 256

dataset:
  sources:
    bfd:
      type: parquet
      path: modules/pretrain/configs/smoke_data/bfd_smoke.parquet
      sampling_fraction: 1.0
      cluster_column: cluster_rep_at_30
    mgnify:
      type: parquet
      path: modules/pretrain/configs/smoke_data/mgnify_smoke.parquet
      sampling_fraction: 1.0
      cluster_column: cluster_rep_at_30
    uniref:
      type: parquet
      path: modules/pretrain/configs/smoke_data/uniref_smoke.parquet
      sampling_fraction: 1.0
      cluster_column: cluster_rep_at_30
  val_holdout_modulus: 20

dataloader:
  max_tokens: 16384
  dataloader_num_workers: 4

trainer:
  num_epochs: 3
  gradient_accumulation_steps: 2
  output_dir: "smoke_runs/gpu"
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  hf_save_steps: 50
